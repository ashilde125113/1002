    @media(max-width:930px){.app{grid-template-columns:74px minmax(0,1fr)}aside{padding:23px 10px;align-items:center}.brand{padding:0}.brand>div:last-child,.nav-label,.nav button span:not(.nav-icon),.mini-note{display:none}.nav{width:100%}.nav button{justify-content:center;padding:12px 5px}.side-bottom{display:none}.lower{grid-template-columns:1fr}.right-column{display:grid;grid-template-columns:1fr 1fr;gap:16px}.right-column>.panel{height:fit-content}.right-column .content-panel{padding:16px}.habit-days{gap:2px}.habit-day{width:17px;height:17px}}

<body>
<div class="app">
  <aside>
    <div class="brand"><div class="brand-mark">✦</div><div><strong>日常</strong><small>把日子過成喜歡的樣子</small></div></div>
    <div><div class="nav-label">工作空間</div><nav class="nav"><button class="active" data-section="總覽"><span class="nav-icon">⌂</span><span>總覽</span></button><button data-section="行程"><span class="nav-icon">▦</span><span>行程</span></button><button data-section="任務"><span class="nav-icon">☑</span><span>待辦任務</span></button><button data-section="習慣"><span class="nav-icon">◉</span><span>目標與習慣</span></button><button data-section="專案"><span class="nav-icon">▤</span><span>專案</span></button><button data-section="靈感"><span class="nav-icon">✧</span><span>靈感筆記</span></button></nav></div>

  </aside>
  <main>
    <div class="topbar"><span class="eyebrow">THURSDAY · 2026</span><div class="top-actions"><button class="outline-btn" id="pinBtn">⌖　桌面便利貼</button><button class="icon-btn" title="通知">♧</button><div class="avatar">安</div></div></div>
    <section class="welcome"><div><div class="eyebrow" id="fullDate">2026 年 10 月 30 日 星期五</div><h1 id="greeting">早安，安安 ☀</h1><p>一點一點，把想做的事都完成。</p></div><button class="add-btn" id="addBtn">＋ 新增事項</button></section>
    <section class="summary" id="summary"></section>
    <section class="panel calendar-panel">
      <div class="panel-head"><div class="panel-title"><h2>行程總覽</h2><span class="eyebrow">MY CALENDAR</span></div><div class="views" id="viewSwitch"><button class="active" data-view="day">日</button><button data-view="week">週</button><button data-view="month">月</button></div><div class="date-nav"><button class="tiny-btn" id="prev">‹</button><strong id="rangeLabel"></strong><button class="tiny-btn" id="next">›</button><button class="tiny-btn" id="todayBtn" title="回到今天">◎</button></div></div>
      <div id="calendar"></div>
    </section>
    <div class="lower">
      <section class="panel content-panel"><div class="panel-head"><div class="panel-title"><h2 id="listHeading">今日安排</h2><span class="eyebrow">YOUR PLAN</span></div><button class="tiny-btn" id="listAdd" title="新增">＋</button></div><div class="tabs" id="tabs"><button class="active" data-filter="all">全部</button><button data-filter="schedule">行程</button><button data-filter="task">待辦</button><button data-filter="habit">習慣打卡</button><button data-filter="inspiration">靈感</button></div><div class="task-list" id="taskList"></div></section>
      <div class="right-column"><section class="panel content-panel"><div class="panel-head"><div class="panel-title"><h2>習慣追蹤</h2><span class="eyebrow">THIS WEEK</span></div></div><div id="habits"></div></section><section class="panel content-panel"><div class="panel-head"><div class="panel-title"><h2>專案進度</h2><span class="eyebrow">IN MOTION</span></div><button class="tiny-btn" data-section="專案">···</button></div><div id="projects"></div><div class="inspiration"><div class="inspiration-label">✧ 靈感角落</div><p id="quote">「慢慢來，比較快。每一小步都算數。」</p><button id="newQuote">換一句靈感 ↗</button></div></section></div>
    </div>
  </main>
</div>
<nav class="mobile-nav"><button class="active" data-section="總覽"><b>⌂</b>總覽</button><button data-section="行程"><b>▦</b>行程</button><button data-section="任務"><b>☑</b>任務</button><button data-section="習慣"><b>◉</b>習慣</button><button data-section="專案"><b>▤</b>專案</button></nav>
<div class="modal-backdrop" id="modal"><form class="modal" id="itemForm"><div class="modal-head"><h2>新增一件事</h2><button type="button" class="close" id="closeModal">×</button></div><div class="field"><label for="itemTitle">名稱</label><input id="itemTitle" required maxlength="80" placeholder="例如：準備簡報初稿" /></div><div class="field"><label for="itemType">類型</label><select id="itemType"><option value="task">待辦任務</option><option value="schedule">行程</option><option value="habit">習慣打卡</option><option value="inspiration">靈感筆記</option></select></div><div class="field" id="timeField"><label for="itemTime">時間（選填）</label><input id="itemTime" type="time" /></div><div class="field"><label for="itemNote">備註（選填）</label><textarea id="itemNote" placeholder="補充一點細節…"></textarea></div><div class="modal-actions"><button type="button" class="cancel" id="cancelModal">取消</button><button class="add-btn">建立事項</button></div></form></div>
<script>
(()=>{
 const today=new Date(2026,9,30);let selected=new Date(today),view='week',filter='all';
 const seed=[
 {id:1,title:'晨間伸展與呼吸',type:'habit',date:'2026-10-30',time:'07:30',done:true,tag:'身心照顧',color:'sage'},
 {id:2,title:'產品設計週會',type:'schedule',date:'2026-10-30',time:'09:30',done:false,tag:'工作',color:'blue'},
 {id:3,title:'完成首頁線框稿',type:'task',date:'2026-10-30',time:'11:00',done:false,tag:'網站改版',color:'rose'},
 {id:4,title:'午休散步 15 分鐘',type:'habit',date:'2026-10-30',time:'12:30',done:false,tag:'身心照顧',color:'sage'},
 {id:5,title:'整理使用者訪談重點',type:'task',date:'2026-10-30',time:'14:00',done:false,tag:'網站改版',color:'rose'},
 {id:6,title:'和小林喝咖啡',type:'schedule',date:'2026-10-30',time:'16:30',done:false,tag:'生活',color:'ochre'},
 {id:7,title:'讀書 20 分鐘',type:'habit',date:'2026-10-30',time:'21:00',done:false,tag:'自我成長',color:'lav'},
 {id:8,title:'提交研究計畫初稿',type:'task',date:'2026-10-28',time:'15:00',done:true,tag:'研究計畫',color:'blue'},
 {id:9,title:'牙醫回診',type:'schedule',date:'2026-11-02',time:'10:00',done:false,tag:'生活',color:'ochre'},
 {id:10,title:'靈感：把早晨留給自己',type:'inspiration',date:'2026-10-30',time:'',done:false,tag:'靈感',color:'lav'}
 ];
 let items;try{items=JSON.parse(localStorage.getItem('daily-items'))||seed}catch{items=seed}
 let habitDone=JSON.parse(localStorage.getItem('daily-habits')||'{}');
 const projects=[{name:'個人網站改版',done:7,total:10,color:'#9eaf99',sub:'本週完成 3 項任務'},{name:'研究計畫',done:4,total:8,color:'#a9bdc5',sub:'距離提案日還有 12 天'},{name:'秋日閱讀清單',done:5,total:12,color:'#d0b7aa',sub:'持續累積中，做得很好'}];
 const quotes=['「慢慢來，比較快。每一小步都算數。」','「不必一次到位，只要比昨天更靠近一點。」','「把注意力放回此刻，事情便有了入口。」','「留白不是浪費，是讓好事發生的空間。」'];
 const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0'), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 const fmt=(d,opt={month:'long',day:'numeric'})=>new Intl.DateTimeFormat('zh-TW',opt).format(d);
 const persist=()=>{localStorage.setItem('daily-items',JSON.stringify(items));localStorage.setItem('daily-habits',JSON.stringify(habitDone))};
 function render(){renderSummary();renderCalendar();renderTasks();renderHabits();renderProjects();$('#fullDate').textContent=`${selected.getFullYear()} 年 ${selected.getMonth()+1} 月 ${selected.getDate()} 日　${new Intl.DateTimeFormat('zh-TW',{weekday:'long'}).format(selected)}`;$('#listHeading').textContent=key(selected)===key(today)?'今日安排':`${selected.getMonth()+1} 月 ${selected.getDate()} 日安排`}
 function renderSummary(){let todays=items.filter(x=>x.date===key(selected)),done=todays.filter(x=>x.done).length;$('#summary').innerHTML=`<div class="stat"><div class="stat-top">今日行程 <span class="stat-icon">▦</span></div><b>${todays.filter(x=>x.type==='schedule').length}<small> 項安排</small></b></div><div class="stat"><div class="stat-top">待辦進度 <span class="stat-icon">☑</span></div><b>${done}<small> / ${todays.length} 完成</small></b></div><div class="stat"><div class="stat-top">習慣打卡 <span class="stat-icon">◉</span></div><b>${todays.filter(x=>x.type==='habit'&&x.done).length}<small> / ${todays.filter(x=>x.type==='habit').length} 今日</small></b></div><div class="stat"><div class="stat-top">進行中專案 <span class="stat-icon">▤</span></div><b>${projects.length}<small> 個計畫</small></b></div>`}
 function renderCalendar(){let el=$('#calendar');if(view==='day'){let d=new Date(selected);$('#rangeLabel').textContent=fmt(d,{year:'numeric',month:'long',day:'numeric'});let dayItems=items.filter(x=>x.date===key(d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));el.innerHTML=`<div style="padding:4px 0 8px">${Array.from({length:15},(_,i)=>{let h=i+7,matched=dayItems.filter(x=>x.time&&Number(x.time.slice(0,2))===h);return `<div style="height:42px;border-top:1px solid #efeee8;display:grid;grid-template-columns:55px 1fr;align-items:center"><span style="font-size:10px;color:#a1a49d">${pad(h)}:00</span><div>${matched.map(x=>`<span class="event-chip ${x.color}" style="display:inline-block;font-size:11px;padding:5px 9px;margin-right:6px">${x.time} ${escapeHTML(x.title)}</span>`).join('')}</div></div>`}).join('')}</div>`;return}
 let start,end;if(view==='week'){start=new Date(selected);start.setDate(start.getDate()-((start.getDay()+6)%7));end=new Date(start);end.setDate(start.getDate()+6);$('#rangeLabel').textContent=`${start.getMonth()+1}月${start.getDate()}日 — ${end.getMonth()+1}月${end.getDate()}日`}else{start=new Date(selected.getFullYear(),selected.getMonth(),1);let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);end=new Date(selected.getFullYear(),selected.getMonth()+1,0);end.setDate(end.getDate()+(6-((end.getDay()+6)%7)));$('#rangeLabel').textContent=`${selected.getFullYear()}年 ${selected.getMonth()+1}月`}
 let days=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d));el.innerHTML=`<div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="day-head">${x}</div>`).join('')}${days.map(d=>{let its=items.filter(x=>x.date===key(d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));let classes=`day-cell ${d.getMonth()!==selected.getMonth()&&view==='month'?'outside':''} ${key(d)===key(today)?'today':''} ${key(d)===key(selected)?'selected':''}`;return `<div class="${classes}" data-day="${key(d)}"><div class="day-num">${d.getDate()}</div>${its.slice(0,view==='week'?3:2).map(x=>`<div class="event-chip ${x.color}" title="${x.time?x.time+' · ':''}${escapeHTML(x.title)}">${x.time?x.time+' · ':''}${escapeHTML(x.title)}</div>`).join('')}${its.length>(view==='week'?3:2)?`<div class="more-events">＋${its.length-(view==='week'?3:2)} 項</div>`:''}</div>`}).join('')}</div>`;
 el.querySelectorAll('[data-day]').forEach(c=>c.addEventListener('click',()=>{selected=new Date(c.dataset.day+'T12:00:00');render()}))}
 const typeLabel=t=>({schedule:'行程',task:'待辦',habit:'習慣',inspiration:'靈感'}[t]||t);
 function renderTasks(){let list=items.filter(x=>x.date===key(selected)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));if(filter!=='all')list=list.filter(x=>x.type===filter);$('#taskList').innerHTML=list.length?list.map(x=>`<div class="task ${x.done?'done':''}"><input class="check" type="checkbox" data-check="${x.id}" ${x.done?'checked':''} aria-label="標記${escapeHTML(x.title)}完成"><div class="task-main"><div class="task-title">${escapeHTML(x.title)}</div><div class="task-meta">${x.time?`<span>${x.time}</span>`:''}<span class="tag ${x.color}">${escapeHTML(x.tag||typeLabel(x.type))}</span><span>${typeLabel(x.type)}</span></div></div></div>`).join(''):'<div class="empty">這一天還沒有事項，新增一件小事吧 ☁</div>';document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let it=items.find(i=>i.id===Number(c.dataset.check));if(it){it.done=c.checked;persist();render()}})}
 const habitDefs=[['🌿','晨間伸展',5],['🚶','午休散步',3],['📖','閱讀 20 分鐘',4]];
 function renderHabits(){let wd=new Date(selected);wd.setDate(wd.getDate()-((wd.getDay()+6)%7));$('#habits').innerHTML=habitDefs.map(([emoji,name,streak],i)=>{let days=Array.from({length:7},(_,n)=>{let d=new Date(wd);d.setDate(wd.getDate()+n);let k=key(d),isDone=habitDone[`${name}-${k}`]||items.some(x=>x.type==='habit'&&x.title===name&&x.date===k&&x.done);return `<button class="habit-day ${isDone?'hit':''} ${k===key(selected)?'current':''}" data-habit="${escapeHTML(name)}" data-date="${k}" title="${k} ${isDone?'已完成':'未完成'}">${isDone?'✓':['一','二','三','四','五','六','日'][n]}</button>`}).join('');return `<div class="habit-row"><div class="habit-left"><div class="habit-emoji">${emoji}</div><div><div class="habit-name">${name}</div><div class="habit-streak">✦ 已連續 ${streak} 天</div></div></div><div class="habit-days">${days}</div></div>`}).join('');document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{let k=`${b.dataset.habit}-${b.dataset.date}`;habitDone[k]=!habitDone[k];persist();render()})}
 function renderProjects(){$('#projects').innerHTML=projects.map(p=>`<div class="project"><div class="project-top"><strong>${p.name}</strong><span>${Math.round(p.done/p.total*100)}%</span></div><div class="progress"><i style="width:${p.done/p.total*100}%;background:${p.color}"></i></div><small>${p.sub}</small></div>`).join('')}
 function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function shift(n){if(view==='day')selected.setDate(selected.getDate()+n);else if(view==='week')selected.setDate(selected.getDate()+n*7);else selected.setMonth(selected.getMonth()+n);render()}
 $('#viewSwitch').onclick=e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;$('#viewSwitch').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderCalendar()};$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#todayBtn').onclick=()=>{selected=new Date(today);render()};
 $('#tabs').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderTasks()};
 const modal=$('#modal');function openModal(type){modal.classList.add('show');$('#itemType').value=type||'task';$('#itemTitle').focus()}function closeModal(){modal.classList.remove('show')};$('#addBtn').onclick=()=>openModal();$('#listAdd').onclick=()=>openModal();$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#itemForm').onsubmit=e=>{e.preventDefault();let type=$('#itemType').value,title=$('#itemTitle').value.trim();if(!title)return;items.push({id:Date.now(),title,type,date:key(selected),time:$('#itemTime').value,done:false,tag:$('#itemNote').value.trim()||typeLabel(type),color:{schedule:'blue',task:'rose',habit:'sage',inspiration:'lav'}[type]});persist();e.target.reset();closeModal();render()};$('#itemType').onchange=e=>$('#timeField').style.display=e.target.value==='inspiration'?'none':'grid';
 $('#newQuote').onclick=()=>{$('#quote').textContent=quotes[Math.floor(Math.random()*quotes.length)]};$('#pinBtn').onclick=e=>{let b=e.currentTarget;b.textContent=b.dataset.pinned==='true'?'⌖　桌面便利貼':'✓　已釘選今日面板';b.dataset.pinned=b.dataset.pinned==='true'?'false':'true'};
 document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===b.dataset.section));let target=b.dataset.section;if(target==='總覽')filter='all';else if(target==='行程')filter='schedule';else if(target==='任務')filter='task';else if(target==='習慣')filter='habit';else if(target==='靈感')filter='inspiration';else if(target==='專案'){document.querySelector('#projects').scrollIntoView({behavior:'smooth',block:'center'});return}document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));renderTasks();document.querySelector('.lower').scrollIntoView({behavior:'smooth',block:'start'})});
 render();
})();
</script>
</body>
</html>
